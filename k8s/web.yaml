apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-sense-web
spec:
  replicas: 2                               # two copies, so one can restart without downtime
  selector:
    matchLabels: { app: ci-sense-web }
  template:
    metadata:
      labels: { app: ci-sense-web }
    spec:
      containers:
        - name: web
          image: ci-sense-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ci-sense-web
spec:
  selector: { app: ci-sense-web }
  ports:
    - port: 80
      targetPort: 80
