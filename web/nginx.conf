server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Kubernetes service named ci-sense-api.
  location /api/ {
    proxy_pass http://ci-sense-api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;        # keeps live triage streaming (SSE) working
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;  # single-page app routes
  }
}
